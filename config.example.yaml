server:
  listen: "127.0.0.1:8318"
  api_keys: []
  max_body_bytes: 67108864
  shutdown_timeout: 10s
  log_level: info
  log_file: ""

upstream:
  base_url: "https://opencode.ai/zen/v1"
  model_prefix: "oc/"
  models: []
  responses_models: []   # 只支持 /responses 协议的上游模型 id
  exclude_models: []     # 从暴露集合中剔除的上游模型 id
  match_regex: '(-free$)|(^big-pickle$)|(^space-bunny)'
  model_aliases: {}
  catalog_file: "./data/catalog.json"
  catalog_refresh: 6h
  catalog_timeout: 10s
  catalog_via_proxy: false
  metadata_url: "https://models.opencode.ai/api.json"   # 官方模型目录；显式置空关闭元数据发现
  metadata_file: "./data/metadata.json"
  metadata_refresh: 24h
  metadata_timeout: 15s
  inject_tools: true
  force_stream: true
  nonstream_policy: force
  restore_tool_names: true
  user_agent: "opencode/1.18.31"
  client_name: "desktop"
  session_ttl: 30m
  request_timeout: 300s
  first_byte_timeout: 60s

proxy:
  proxies: []
  proxy_file: ""
  strategy: round_robin
  max_attempts: 3
  cooldown:
    base: 30s
    factor: 2.0
    max: 10m
    jitter: 0.2
    statuses: [403, 407, 429, 500, 502, 503, 504]
